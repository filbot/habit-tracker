<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress</title>
    <link rel="stylesheet" href="/static/css/style.css?v=4">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header>
            <h1>WYAO Progress</h1>
            <div class="date" id="current-date"></div>
        </header>

        <!-- Summary Cards -->
        <div class="stats-grid" role="group" aria-label="Statistics">
            <!-- This Week -->
            <div class="card">
                <div class="card-label">This Week</div>
                <div class="card-value-group">
                    <span class="value" id="week-count">0</span>
                    <span class="unit">logs</span>
                    <span class="trend-neutral" id="week-trend"></span>
                </div>
                <div class="card-subtext">Current Volume</div>
            </div>

            <!-- Consistency -->
            <div class="card">
                <div class="card-label">Consistency</div>
                <div class="card-value-group">
                    <span class="value" id="streak-count">0</span>
                    <span class="unit">weeks</span>
                </div>
                <div class="card-subtext" id="streak-subtext">Current Streak</div>
            </div>

            <!-- All Time -->
            <div class="card">
                <div class="card-label">All time</div>
                <div class="card-value-group">
                    <span class="value" id="total-count">0</span>
                    <span class="unit">logs</span>
                </div>
                <div class="card-subtext">Total History</div>
            </div>
        </div>

        <!-- Heatmap Section -->
        <div class="heatmap-section">
            <h2>Active days</h2>
            <div class="heatmap-container">
                <div class="heatmap-grid" id="heatmap" role="grid" aria-label="Activity heatmap">
                    <!-- Generated by JS -->
                </div>
                <div class="heatmap-legend">
                    <span>Missed</span>
                    <div class="legend-box level-0"></div>
                    <div class="legend-box level-1"></div>
                    <span>Done</span>
                </div>
            </div>
        </div>
    </div>

    <dialog id="day-dialog" class="day-dialog">
        <div class="dialog-header">
            <h3 id="dialog-date"></h3>
            <form method="dialog">
                <button class="dialog-close" aria-label="Close">&times;</button>
            </form>
        </div>
        <div id="dialog-log-list" class="dialog-log-list"></div>
        <button id="dialog-add-log" class="dialog-add-btn">+ Add log</button>
    </dialog>

    <div id="toast" class="toast" aria-live="polite"></div>

    <script src="/static/js/script.js?v=3"></script>
</body>

</html>
